name: Sync ORCID Publications

on:
  schedule:
    - cron: "0 4 * * 1" # Run weekly on Mondays at 4:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orcid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run ORCID sync script
        run: |
          python bin/sync_orcid.py

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "chore: sync publications from ORCID"
            git push
          )
