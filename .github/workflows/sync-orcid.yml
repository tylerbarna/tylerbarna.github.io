name: Sync Publications (ADS / SciX, ORCID, arXiv)

on:
  schedule:
    - cron: "0 4 * * 1" # Run weekly on Mondays at 4:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Publication sync script
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
          ORCID_ID: "0000-0002-4843-345X"
        run: |
          python bin/sync_publications.py

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "chore: sync publications from ADS, ORCID, and arXiv"
            git push
          )
