name: Sync Publications & Repository Stats

on:
  schedule:
    - cron: "0 4 * * 1" # Run weekly on Mondays at 4:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Run Publication sync script (ADS / SciX, ORCID, arXiv)
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
          SCIX_API_TOKEN: ${{ secrets.SCIX_API_TOKEN }}
          ORCID_ID: "0000-0002-4843-345X"
        run: |
          python bin/sync_publications.py

      - name: Run GitHub Stats sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python bin/sync_github_stats.py

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib _data/repositories.yml _data/metrics.yml
          git diff --staged --quiet || (
            git commit -m "chore: sync publications, bibliometrics, and github stats"
            git push
          )
