name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "bin/*.py"
      - "!docs/**"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "bin/*.py"
      - "!docs/**"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # latest 3.3.x; runner images only ship the newest patch
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Check bibliography 📚
        run: |
          pip3 install pyyaml
          python bin/sync_publications.py --check
      - name: Install ImageMagick 🖼️
        id: magick
        # Ubuntu's package mirrors are sometimes unreachable from runners; a
        # mirror outage shouldn't block a deploy, so fall back below instead.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          if command -v magick || command -v convert; then exit 0; fi
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends imagemagick \
              && exit 0
            sleep 15
          done
          exit 1
      - name: Build 🔧
        run: |
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          if [ "${{ steps.magick.outcome }}" = "success" ]; then
            bundle exec jekyll build
          else
            echo "::warning::ImageMagick unavailable; building without responsive WebP images."
            echo "imagemagick: { enabled: false }" > _config.ci.yml
            bundle exec jekyll build --config _config.yml,_config.ci.yml
          fi
      - name: Check internal links 🔗
        run: python bin/check_links.py _site
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
